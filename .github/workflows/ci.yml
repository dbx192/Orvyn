name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config unixodbc-dev libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - if: runner.os == 'macOS'
        run: brew install unixodbc
      - name: Cache DuckDB
        id: duckdb
        uses: actions/cache@v4
        with:
          path: packaging/duckdb-download/local
          key: duckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/prepare-duckdb.py') }}
      - name: Prepare DuckDB
        if: steps.duckdb.outputs.cache-hit != 'true'
        run: python packaging/prepare-duckdb.py
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-check
      - name: Runtime library paths
        shell: bash
        run: |
          echo "$PWD/packaging/duckdb-download/local/1.5.4" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/packaging/duckdb-download/local/1.5.4" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/packaging/duckdb-download/local/1.5.4" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  services:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: --health-cmd "curl -fs http://localhost:9200/_cluster/health" --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      ORVYN_TEST_PG_HOST: 127.0.0.1
      ORVYN_TEST_PG_USER: postgres
      ORVYN_TEST_PG_DATABASE: postgres
      ORVYN_TEST_MYSQL_HOST: 127.0.0.1
      ORVYN_TEST_MYSQL_USER: root
      ORVYN_TEST_MYSQL_DATABASE: mysql
      ORVYN_TEST_REDIS_HOST: 127.0.0.1
      ORVYN_TEST_ES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config unixodbc-dev
      - name: Cache DuckDB
        id: duckdb
        uses: actions/cache@v4
        with:
          path: packaging/duckdb-download/local
          key: duckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/prepare-duckdb.py') }}
      - name: Prepare DuckDB
        if: steps.duckdb.outputs.cache-hit != 'true'
        run: python3 packaging/prepare-duckdb.py
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service-tests
      - run: cargo test -p app-core --test service_integration --locked -- --ignored
  build:
    name: Build ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, services]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: orvyn-windows-x86_64
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: orvyn-linux-x86_64
          - name: macos-x86_64
            os: macos-15-intel
            artifact: orvyn-macos-x86_64
          - name: macos-aarch64
            os: macos-14
            artifact: orvyn-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config unixodbc-dev libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Cache DuckDB
        id: duckdb
        uses: actions/cache@v4
        with:
          path: packaging/duckdb-download/local
          key: duckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/prepare-duckdb.py') }}
      - name: Prepare DuckDB
        if: steps.duckdb.outputs.cache-hit != 'true'
        run: python packaging/prepare-duckdb.py
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: bash packaging/macos/package.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release files
        run: find release-assets -type f -maxdepth 3 -print
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
