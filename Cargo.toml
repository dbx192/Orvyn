[workspace]
members = [
    "apps/desktop",
    "crates/app-core",
    "crates/db-common",
    "crates/db-duckdb",
    "crates/db-mysql",
    "crates/db-postgres",
    "crates/db-redis",
    "crates/db-sqlite",
    "crates/import-export",
    "crates/secure-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
db-common = { path = "crates/db-common" }
duckdb = "0.10"
mysql_async = "0.34"
redis = { version = "0.25", default-features = false, features = ["aio", "tokio-comp"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.8", features = ["serde", "v4"] }
