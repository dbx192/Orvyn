[workspace]
members = [
    "apps/desktop",
    "crates/app-core",
    "crates/db-common",
    "crates/db-duckdb",
    "crates/db-mysql",
    "crates/db-mongodb",
    "crates/db-odbc",
    "crates/db-sqlserver",
    "crates/db-clickhouse",
    "crates/db-postgres",
    "crates/db-redis",
    "crates/db-sqlite",
    "crates/db-tdengine",
    "crates/db-http",
    "crates/import-export",
    "crates/secure-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.3"
db-common = { path = "crates/db-common" }
duckdb = { version = "~1.10504.0" }
encoding_rs = "0.8"
eframe = "0.27"
redis = { version = "0.25", default-features = false, features = ["aio", "tokio-comp"] }
rfd = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-native-roots"] }
sqlx-mysql = { version = "0.8", default-features = false, features = ["chrono", "rust_decimal"] }
mongodb = { version = "3.2", default-features = false, features = ["rustls-tls"] }
odbc-api = "29.0"
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "tds73"] }
clickhouse = { version = "0.13", default-features = false, features = ["lz4", "rustls-tls"] }
thiserror = "1.0"
tokio = { version = "1.38", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
webpki-roots = "0.26"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
uuid = { version = "1.8", features = ["serde", "v4"] }
