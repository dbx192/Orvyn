[workspace]
members = [
    "apps/desktop",
    "crates/app-core",
    "crates/db-common",
    "crates/db-duckdb",
    "crates/db-mysql",
    "crates/db-postgres",
    "crates/db-redis",
    "crates/db-sqlite",
    "crates/import-export",
    "crates/secure-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
db-common = { path = "crates/db-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.8", features = ["serde", "v4"] }
