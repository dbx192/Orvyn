[package]
name = "orvyn"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
duckdb = ["dep:db-duckdb", "dep:duckdb", "app-core/duckdb"]

[dependencies]
app-core = { path = "../../crates/app-core" }
arboard = { version = "3.6.1", default-features = false }
chrono.workspace = true
db-common.workspace = true
duckdb = { workspace = true, optional = true }
db-duckdb = { path = "../../crates/db-duckdb", optional = true }
db-mysql = { path = "../../crates/db-mysql" }
db-mongodb = { path = "../../crates/db-mongodb" }
db-sqlserver = { path = "../../crates/db-sqlserver" }
db-clickhouse = { path = "../../crates/db-clickhouse" }
db-postgres = { path = "../../crates/db-postgres" }
db-redis = { path = "../../crates/db-redis" }
db-sqlite = { path = "../../crates/db-sqlite" }
eframe.workspace = true
import-export = { path = "../../crates/import-export" }
rfd.workspace = true
secure-store = { path = "../../crates/secure-store" }
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
winres = "0.1"
